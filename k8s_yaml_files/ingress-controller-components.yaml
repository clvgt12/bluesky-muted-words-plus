# k8s_yaml_files/ingress-controller-components.yaml
# Webhook components for NGINX Ingress Controller

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx-admission
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-nginx-admission
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
      - "create"
      - "update"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-nginx-admission
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-nginx-admission
subjects:
  - kind: ServiceAccount
    name: ingress-nginx-admission
    namespace: bluesky-muted-words-plus
---
# ClusterRole for webhook admission (moved here for explicit ordering)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress-nginx-admission-clusterrole
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "update", "list", "watch", "patch"]
---
# ClusterRoleBinding to link ServiceAccount to ClusterRole (moved here for explicit ordering)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress-nginx-admission-clusterrolebinding
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-nginx-admission-clusterrole
subjects:
  - kind: ServiceAccount
    name: ingress-nginx-admission
    namespace: bluesky-muted-words-plus
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ingress-nginx-admission-create
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-controller
        app.kubernetes.io/instance: ingress-controller
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ingress-nginx-admission
      containers:
        - name: create
          image: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.5.2
          imagePullPolicy: IfNotPresent
          args:
            - "create"
            - "--host=ingress-controller-admission,ingress-controller-admission.$(POD_NAMESPACE).svc"
            - "--namespace=$(POD_NAMESPACE)"
            - "--secret-name=ingress-nginx-admission"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      restartPolicy: OnFailure
  backoffLimit: 4
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ingress-nginx-admission-patch
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-controller
        app.kubernetes.io/instance: ingress-controller
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ingress-nginx-admission
      containers:
        - name: patch
          image: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.5.2
          imagePullPolicy: IfNotPresent
          args:
            - "patch"
            - "--webhook-name=ingress-nginx-admission"
            - "--namespace=$(POD_NAMESPACE)"
            - "--secret-name=ingress-nginx-admission"
            - "--patch-mutating=false"
            - "--patch-validating=true" # Explicitly set validating patch
            - "--patch-failure-policy=Fail"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      restartPolicy: OnFailure
  backoffLimit: 4
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ingress-nginx-admission
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
webhooks:
  - name: validate.nginx.ingress.kubernetes.io
    rules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
    clientConfig:
      service:
        namespace: bluesky-muted-words-plus
        name: ingress-controller-admission
        path: /validate-ingress-nginx-ingress-controller
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions:
      - v1
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-controller-admission
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
  ports:
    - name: https-webhook
      port: 443
      targetPort: webhook
