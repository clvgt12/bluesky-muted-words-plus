# k8s_yaml_files/user-list-tool.yaml
# Combined Deployment and Service for the user-list-tool
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-list-tool
  namespace: bluesky-muted-words-plus # Ensure this matches your namespace
  labels:
    app: user-list-tool
spec:
  replicas: 1 # Typically 1 replica for a UI tool
  selector:
    matchLabels:
      app: user-list-tool
  template:
    metadata:
      labels:
        app: user-list-tool
    spec:
      # --- GPU Configuration for User List Tool (if ML inference is GPU-accelerated) ---
      nodeSelector:
        "kubernetes.io/hostname": "minikube" # Targets the minikube node specifically
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: user-list-tool-container
        image: bluesky-user-list-tool:latest # Image built locally by Minikube's Docker daemon
        imagePullPolicy: IfNotPresent # Use local image if present
        ports:
        - containerPort: 8501 # Streamlit's default port
        env:
        # Database credentials from Kubernetes Secret
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: database
        # Database host and port for connecting to the postgres-service
        - name: POSTGRES_HOST
          value: "postgres-service" # This is the Kubernetes Service name for your PostgreSQL DB
        - name: POSTGRES_PORT
          value: "5432"
        # Environment variable from your Dockerfile
        - name: FLASK_ENV
          value: "development"
        # Hugging Face environment variables if needed by your Python code at runtime
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/home/appuser/.cache/huggingface"

        resources:
          requests:
            cpu: "200m" # Request 0.2 CPU core
            memory: "512Mi" # Request 512 MiB memory
          limits:
            cpu: "500m" # Limit to 0.5 CPU core
            memory: "1Gi" # Limit to 1 GiB memory
        
        # Liveness and Readiness Probes for Streamlit
        # This assumes Streamlit is serving on /
        livenessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 15 # Give Streamlit time to start
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 5 # Shorter delay for readiness
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: user-list-tool-service
  namespace: bluesky-muted-words-plus # Ensure this matches your namespace
  labels:
    app: user-list-tool
spec:
  selector:
    app: user-list-tool # Selects pods with this label
  ports:
  - protocol: TCP
    port: 8501 # The port this service will expose
    targetPort: 8501 # The port the container listens on (Streamlit's port)
  type: NodePort # Expose the service outside the cluster for Minikube access
