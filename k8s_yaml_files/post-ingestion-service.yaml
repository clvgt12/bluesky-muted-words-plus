# k8s_yaml_files/post-ingestion-service.yaml
# Combined Deployment and Service for the post-ingestion-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-ingestion-service
  namespace: bluesky-muted-words-plus # Ensure this matches your namespace
  labels:
    app: post-ingestion-service
spec:
  replicas: 1 # Typically one replica for this service
  selector:
    matchLabels:
      app: post-ingestion-service
  template:
    metadata:
      labels:
        app: post-ingestion-service
    spec:
      # If using GPU, ensure your Minikube has a GPU-enabled driver and setup
      nodeSelector:
        # For Minikube with --gpus all, the node will have this label.
        # You might need to check your minikube node labels: kubectl get nodes -o yaml
        "kubernetes.io/hostname": "minikube" # Targets the minikube node specifically
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ingestion-worker
        image: bluesky-post-ingestion-service:latest # Your locally built image
        imagePullPolicy: IfNotPresent # Use local image if present
        # This container does not expose a server, as it's a background worker. 
        ports:
        - containerPort: 8001
        env:
        # Database credentials from Kubernetes Secret
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: database
        - name: BSKY_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: handle
        - name: BSKY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: bsky_password
        - name: HANDLE
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: handle
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: bsky_password
        # Connect to PostgreSQL Service directly
        - name: POSTGRES_HOST
          value: "postgres-service"
        - name: POSTGRES_PORT
          value: "5432"
        # Environment variables from your Dockerfile or application needs
        - name: FLASK_ENV
          value: "development"
        - name: SERVICE_DID
          value: "did:web:bluesky-muted-words-plus-788033931517.us-east1.run.app" # Example, update as needed
        - name: HOSTNAME
          value: "bluesky-muted-words-plus-788033931517.us-east1.run.app" # Example, update as needed
        - name: FEED_URI
          value: "at://did:plc:btd7cocvy4na2wyowrpbo64o/app.bsky.feed.generator/bluesky-muted-words-plus" # Example, update as needed
        - name: DEFAULT_DID
          value: "did:plc:btd7cocvy4na2wyowrpbo64o" # Example, update as needed
        - name: IGNORE_REPLY_POSTS
          value: "true"
        - name: IGNORE_OLD_POSTS
          value: "true"
        - name: MODEL_NAME
          value: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
        - name: SHOW_THRESHOLD
          value: "0.750"
        - name: HIDE_THRESHOLD
          value: "0.575"
        - name: AMBIGUOUS_POST_POLICY
          value: "HIDE"
        - name: BIAS_WEIGHT
          value: "0.25"
        - name: SOFTMAX_TEMPERATURE
          value: "1.0"
        - name: DB_RECORD_TTL
          value: "110"
        - name: DB_THREAD_HYSTERESIS
          value: "10"
        # Uncomment and configure these if you re-enable GCP integration later
        # - name: GOOGLE_APPLICATION_CREDENTIALS
        #   value: "/var/secrets/google/key.json"
        # - name: PROJECT_ID
        #   value: "bluesky-muted-words-plus"
        # - name: GCP_PROJECT
        #   value: "bluesky-muted-words-plus"
        # - name: GCLOUD_PROJECT
        #   value: "bluesky-muted-words-plus"
        # - name: GOOGLE_CLOUD_PROJECT
        #   value: "bluesky-muted-words-plus"
        # - name: CLOUDSDK_CORE_PROJECT
        #   value: "bluesky-muted-words-plus"
        resources:
          requests:
            cpu: "500m"
            memory: "8Gi" # Increased memory request for larger SpaCy processing
          limits:
            cpu: "2"
            memory: "16Gi" # Increased memory limit for larger SpaCy processing
        # Liveness Probe (exec check for process - now 'pgrep' is available in the container)
        livenessProbe:
          exec:
            command: ["pgrep", "-f", "post_ingestion_service_main.py"] # Check for running process
          initialDelaySeconds: 60 # Still give ample time for initial startup
          periodSeconds: 30 # Check less frequently
          timeoutSeconds: 10 # Allow more time for command to execute
          failureThreshold: 5 # More failures allowed before unhealthy
        # Readiness Probe (exec check for process - now 'pgrep' is available in the container)
        readinessProbe:
          exec:
            command: ["pgrep", "-f", "post_ingestion_service_main.py"] # Check for running process
          initialDelaySeconds: 30 # Still give ample time for initial startup
          periodSeconds: 30 # Check less frequently
          timeoutSeconds: 10 # Allow more time for command to execute
          failureThreshold: 5 # More failures allowed before unready
      # volumeMounts:
      #   # Mount the secret containing the Google Service Account key
      #   - name: google-cloud-key
      #     mountPath: "/var/secrets/google" # Directory where the key will be mounted
      #     readOnly: true
      #   # ... (any other necessary volume mounts for your application) ...

      # Cloud SQL Proxy sidecar (currently commented out)
      # - name: cloudsql-proxy
      #   image: gcr.io/cloud-sql-proxy/cloud-sql-proxy:latest
      #   imagePullPolicy: Always
      #   command: ["/cloud_sql_proxy"]
      #   args:
      #     - "-instances=<YOUR_GCP_PROJECT_ID>:<YOUR_GCP_REGION>:<YOUR_POSTGRES_INSTANCE_NAME>=tcp:5432"
      #     - "-credential_file=/var/secrets/google/key.json"
      #   securityContext:
      #     runAsNonRoot: true
      #   env:
      #     - name: GOOGLE_APPLICATION_CREDENTIALS
      #       value: "/var/secrets/google/key.json"
      #   resources:
      #     requests:
      #       cpu: "100m"
      #       memory: "128Mi"
      #     limits:
      #       cpu: "200m"
      #       memory: "256Mi"
      #   volumeMounts:
      #   - name: google-cloud-key
      #     mountPath: "/var/secrets/google"
      #     readOnly: true

      # volumes:
      # # Define the volume for the Kubernetes Secret (uncomment if using GCP credentials)
      # - name: google-cloud-key
      #   secret:
      #     secretName: google-application-credentials
      #     items:
      #     - key: key.json
      #       path: key.json
      # # ... (any other volumes your pod needs, like for SpaCy models or persistent storage) ...
---
# The Service for a background worker like post-ingestion-service might not be strictly necessary
# if no other services within the cluster need to connect to it via a stable DNS name.
# As this service does not expose a network port for its primary function or probes,
# the 'ports' section is removed from its Service definition.
apiVersion: v1
kind: Service
metadata:
  name: post-ingestion-service
  namespace: bluesky-muted-words-plus # Ensure this matches your namespace
  labels:
    app: post-ingestion-service
spec:
  selector:
    app: post-ingestion-service # Selects pods with this label
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP # Internal service within the cluster
