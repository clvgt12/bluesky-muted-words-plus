# k8s_yaml_files/ingress-controller.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluesky-core-ingress
  namespace: bluesky-muted-words-plus # In the same namespace as your services
  annotations:
    kubernetes.io/ingress.class: nginx # This refers to the IngressClass created above
    # No rewrite-target annotation here, as these paths are passed directly
spec:
  rules:
  - host: minikube.lan # Your desired hostname for Minikube
    http:
      paths:
      # --- Paths for core Bluesky Feed Generator API (expected at root) ---
      - path: / # Root path for the index() endpoint
        pathType: Prefix
        backend:
          service:
            name: feed-endpoint-service
            port:
              number: 80 # Flask app's service port
      - path: /health/ # Direct health check endpoint
        pathType: Prefix
        backend:
          service:
            name: feed-endpoint-service
            port:
              number: 80 # Flask app's service port
      - path: /.well-known/did.json # Standard DID document path
        pathType: ImplementationSpecific # CHANGED from Prefix to ImplementationSpecific
        backend:
          service:
            name: feed-endpoint-service
            port:
              number: 80 # Flask app's service port
      - path: /xrpc/app.bsky.feed.describeFeedGenerator # Describe feed generator endpoint
        pathType: ImplementationSpecific # CHANGED from Prefix to ImplementationSpecific
        backend:
          service:
            name: feed-endpoint-service
            port:
              number: 80 # Flask app's service port
      - path: /xrpc/app.bsky.feed.getFeedSkeleton # Get feed skeleton endpoint
        pathType: ImplementationSpecific # CHANGED from Prefix to ImplementationSpecific
        backend:
          service:
            name: feed-endpoint-service
            port:
              number: 80 # Flask app's service port
---
# Ingress for the /admin-portal/ path (requires rewrite)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluesky-admin-rewrite-ingress
  namespace: bluesky-muted-words-plus
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1 # Apply rewrite-target here for this specific path
spec:
  rules:
  - host: minikube.lan
    http:
      paths:
      - path: /admin-portal/(.*) # Path for the user list tool, captures everything after /admin-portal/
        pathType: ImplementationSpecific
        backend:
          service:
            name: user-list-tool-service
            port:
              number: 8501