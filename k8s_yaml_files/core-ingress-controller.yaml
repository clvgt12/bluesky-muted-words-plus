# k8s_yaml_files/core-ingress-controller.yaml
# Core NGINX Ingress Controller Deployment and Service
# (Excludes webhook components for phased deployment)

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-controller
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress-controller
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
rules:
  - apiGroups:
      - ""
    resources:
      - "configmaps"
      - "endpoints"
      - "nodes"
      - "pods"
      - "secrets"
    verbs:
      - "list"
      - "watch"
  - apiGroups:
      - ""
    resources:
      - "nodes"
    verbs:
      - "get"
  - apiGroups:
      - ""
    resources:
      - "services"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - "extensions"
      - "networking.k8s.io"
    resources:
      - "ingresses"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - ""
    resources:
      - "events"
    verbs:
      - "create"
      - "patch"
  - apiGroups:
      - "extensions"
      - "networking.k8s.io"
    resources:
      - "ingresses/status"
    verbs:
      - "update"
  - apiGroups:
      - "networking.k8s.io"
    resources:
      - "ingressclasses"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups: ["discovery.k8s.io"] # <--- ADDED THIS API GROUP
    resources: ["endpointslices"] # <--- ADDED THIS RESOURCE
    verbs: ["list", "watch"] # <--- ADDED THESE VERBS
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress-controller
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-controller
subjects:
  - kind: ServiceAccount
    name: ingress-controller
    namespace: bluesky-muted-words-plus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-controller
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
rules:
  - apiGroups:
      - ""
    resources:
      - "namespaces"
    verbs:
      - "get"
  - apiGroups:
      - ""
    resources:
      - "configmaps"
      - "pods"
      - "secrets"
      - "endpoints"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - "leases"
    verbs:
      - "list"
      - "watch"
      - "get"
      - "update"
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-controller
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-controller
subjects:
  - kind: ServiceAccount
    name: ingress-controller
    namespace: bluesky-muted-words-plus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-controller
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-controller
      app.kubernetes.io/instance: ingress-controller
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-controller
        app.kubernetes.io/instance: ingress-controller
    spec:
      serviceAccountName: ingress-controller
      containers:
        - name: controller
          image: registry.k8s.io/ingress-nginx/controller:v1.12.3
          args:
            - /nginx-ingress-controller
            - --publish-service=$(POD_NAMESPACE)/ingress-controller
            - --controller-class=k8s.io/ingress-nginx
            - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller
            - --validating-webhook=:8443
            - --validating-webhook-certificate=/usr/local/certificates/cert
            - --validating-webhook-key=/usr/local/certificates/key
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            runAsUser: 101
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib:/usr/local/nginx/lib
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: webhook
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: webhook-cert
              mountPath: /usr/local/certificates/
              readOnly: true
      volumes:
        - name: webhook-cert
          secret:
            secretName: ingress-nginx-admission # This secret is needed by the controller, but created by the webhook jobs
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-controller
  namespace: bluesky-muted-words-plus
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
      nodePort: 30443
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: ingress-controller
    app.kubernetes.io/instance: ingress-controller
spec:
  controller: k8s.io/ingress-nginx
