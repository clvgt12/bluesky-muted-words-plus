services:
  postgres:
    image: ankane/pgvector:latest
    container_name: pgvector-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    # environment:
      # you can override these in .env.development if you like
      # POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # POSTGRES_DB:     ${POSTGRES_DB:-feed_database}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  feed-generator:
    container_name: bluesky-muted-words-plus
    build:
      context: .
      dockerfile: Dockerfile.bluesky-muted-words-plus
      args:
        MODEL_NAME: ${MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    image: bluesky-muted-words-plus
    restart: unless-stopped
    runtime: nvidia             # remove if you don’t need GPU
    ports:
      - "8000:8000"
    env_file:
      - .env.development
    environment:
      MODEL_NAME: ${MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-list-tool:
    container_name: bluesky-user-list-tool
    build:
      context: .
      dockerfile: Dockerfile.user-list-tool
      args:
        MODEL_NAME: ${MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    image: bluesky-user-list-tool
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env.development
    depends_on:
      - postgres
    # the CMD in Dockerfile.user-list-tool will launch Streamlit on 0.0.0.0:8501

volumes:
  pgdata:
